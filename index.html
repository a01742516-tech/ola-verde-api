<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Ola Verde - Panel de Control</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f7f6; color: #333; }
    h1 { color: #2e7d32; margin-bottom: 5px; }
    .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-top: 20px; }
    .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    @media (max-width: 600px) { .grid-form { grid-template-columns: 1fr; } }
    label { font-weight: bold; font-size: 0.9em; display: block; margin-bottom: 5px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    .full-width { grid-column: 1 / -1; }
    button { background-color: #2e7d32; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-size: 1em; font-weight: bold; }
    button:hover { background-color: #1b5e20; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #2e7d32; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    .no-data { text-align: center; color: #777; font-style: italic; padding: 20px; }
  </style>
</head>
<body>

  <h1>🌱 La Ola Verde — Panel Operativo</h1>
  <p>Monitoreo y registro de lotes de lirio acuático en Culiacán, Sinaloa.</p>

  <!-- Formulario Protegido -->
  <div class="card">
    <h2>📥 Registro de Nuevo Prensado</h2>
    <form id="form-prensado" onsubmit="guardarRegistro(event)">
      <div class="grid-form">
        <div>
          <label>Código de Lote:</label>
          <input type="text" id="lote_id" placeholder="Ej. LIRIO-CUL-005" required>
        </div>
        <div>
          <label>Operador ID:</label>
          <input type="text" id="operador_id" placeholder="Ej. OP-MAURI" required>
        </div>
        <div>
          <label>Peso Inicial (kg):</label>
          <input type="number" step="0.01" id="peso_inicial_kg" placeholder="500.00" required>
        </div>
        <div>
          <label>Presión de Prensa (PSI):</label>
          <input type="number" step="0.01" id="presion_prensa_psi" placeholder="150.00" required>
        </div>
        <div>
          <label>Tiempo de Prensado (min):</label>
          <input type="number" id="tiempo_prensado_min" placeholder="25" required>
        </div>
        <div>
          <label>Litros de Lixiviado Extraído:</label>
          <input type="number" step="0.01" id="litros_lixiviado" placeholder="380.00" required>
        </div>
        <div>
          <label>Peso Final (kg):</label>
          <input type="number" step="0.01" id="peso_final_kg" placeholder="120.00" required>
        </div>
        <div>
          <label style="color: #c62828;">🔑 Clave de Seguridad del Proyecto:</label>
          <input type="password" id="clave_acceso" placeholder="Ingrese el PIN autorizado" required>
        </div>
        <div class="full-width">
          <button type="submit" style="width: 100%;">💾 Guardar Registro Seguro</button>
        </div>
      </div>
    </form>
  </div>

  <!-- Tabla de Registros -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>📊 Registros Guardados</h2>
      <button onclick="cargarDatos()" style="padding: 8px 15px;">🔄 Actualizar</button>
    </div>
    
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Lote</th>
          <th>Peso Inic. (kg)</th>
          <th>Presión (PSI)</th>
          <th>Tiempo (min)</th>
          <th>Lixiviado (L)</th>
          <th>Peso Fin. (kg)</th>
          <th>Operador</th>
          <th>Fecha / Hora</th>
        </tr>
      </thead>
      <tbody id="tabla-cuerpo">
        <tr>
          <td colspan="9" class="no-data">Cargando registros...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    async function cargarDatos() {
      const tbody = document.getElementById('tabla-cuerpo');
      try {
        const respuesta = await fetch('/api/v1/proceso/prensado');
        const resultado = await respuesta.json();

        if (!resultado.data || resultado.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="9" class="no-data">Aún no hay datos registrados. Ingrese un registro para comenzar.</td></tr>';
          return;
        }

        tbody.innerHTML = '';
        resultado.data.forEach(item => {
          const fila = document.createElement('tr');
          fila.innerHTML = `
            <td>${item.id}</td>
            <td><strong>${item.lote_id}</strong></td>
            <td>${item.peso_inicial_kg}</td>
            <td>${item.presion_prensa_psi}</td>
            <td>${item.tiempo_prensado_min}</td>
            <td>${item.litros_lixiviado}</td>
            <td>${item.peso_final_kg}</td>
            <td>${item.operador_id}</td>
            <td>${new Date(item.fecha_registro).toLocaleString()}</td>
          `;
          tbody.appendChild(fila);
        });
      } catch (error) {
        tbody.innerHTML = '<tr><td colspan="9" class="no-data" style="color:red;">Error al conectar con la base de datos.</td></tr>';
      }
    }

    async function guardarRegistro(event) {
      event.preventDefault();

      const clave = document.getElementById('clave_acceso').value;
      const datos = {
        lote_id: document.getElementById('lote_id').value,
        peso_inicial_kg: parseFloat(document.getElementById('peso_inicial_kg').value),
        presion_prensa_psi: parseFloat(document.getElementById('presion_prensa_psi').value),
        tiempo_prensado_min: parseInt(document.getElementById('tiempo_prensado_min').value),
        litros_lixiviado: parseFloat(document.getElementById('litros_lixiviado').value),
        peso_final_kg: parseFloat(document.getElementById('peso_final_kg').value),
        operador_id: document.getElementById('operador_id').value
      };

      try {
        const respuesta = await fetch('/api/v1/proceso/prensado', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'x-api-key': clave
          },
          body: JSON.stringify(datos)
        });

        const resultado = await respuesta.json();

        if (respuesta.ok) {
          alert('✅ Registro guardado correctamente en la base de datos.');
          document.getElementById('form-prensado').reset();
          cargarDatos();
        } else {
          alert('❌ Error: ' + resultado.message);
        }
      } catch (error) {
        alert('❌ Error de red al intentar guardar.');
      }
    }

    cargarDatos();
  </script>

</body>
</html>
